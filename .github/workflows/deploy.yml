# GitHub Actions workflow for deploying the Competency Backend to DigitalOcean
name: Deploy Competency Backend to DO

on:
  push:
    branches:
      - main  # deploy on pushes to main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup SSH key for server access
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      # 3️⃣ Deploy via SSH to your DO server
      - name: Deploy to DigitalOcean
        run: |
          set -e
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
          echo "🚀 Starting deployment on server..."
          cd ${{ secrets.DEPLOY_PATH }}
          
          echo "💻 Pulling latest code from GitHub"
          git fetch origin
          git reset --hard origin/main

          echo "📦 Installing dependencies"
          npm install

          echo "🔧 Building project"
          npm run build

          echo "⚡ Restarting PM2 process"
          pm2 restart competency-api --update-env
          pm2 save

          echo "✅ Deployment complete!"
          EOF